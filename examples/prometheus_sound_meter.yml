# 将这段作为一个条目加入现有 Prometheus 的 scrape_configs 下。
# 不要覆盖已有的 node / smartctl / NAS 监控任务。
- job_name: 'sound-meter'
  scrape_interval: 1s
  scrape_timeout: 800ms
  metrics_path: /metrics
  static_configs:
    - targets: ['192.168.31.180:80']
      labels:
        device: 'esp32-sound-meter'
        room: 'home'
